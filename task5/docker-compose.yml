services:
  back-end:
    build: ./back-end

  front-end:
    build: ./front-end
    depends_on:
      - back-end

  proxy:
    build: 
      context: ./proxy
      dockerfile: Dockerfile
    image: softy-pinko-back-end:task5
    ports:
      - "80:80"
    depends_on:
      - front-end
      - back-end
